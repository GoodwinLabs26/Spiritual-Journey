<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiritual Journey — Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EDE8DE;
    --ticket:#FBF8F1;
    --ink:#2B2A28;
    --ink-soft:#6B6A63;
    --line:#D8D2C2;
    --orange:#E8590C;
    --orange-dark:#A3400A;
    --slate:#3E5C76;
    --slate-dark:#243547;
    --green:#3F7A54;
    --green-bg:#E4F0E6;
    --red:#B23A2F;
    --red-bg:#F6E4E1;
    --amber:#B5790C;
    --amber-bg:#F7EBD3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}

  .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .head h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
  .head .sub{font-size:13px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  .addbtn{background:var(--orange);color:#fff;border:none;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:0.5px;text-transform:uppercase;padding:12px 22px;cursor:pointer;border-radius:2px;}
  .addbtn:hover{background:var(--orange-dark);}
  .addbtn:disabled{opacity:0.5;cursor:not-allowed;}

  .status-bar{font-size:12px;color:var(--ink-soft);margin-bottom:16px;font-family:'JetBrains Mono',monospace;}
  .status-bar.error{color:var(--red);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
  .stat{background:var(--ticket);border:1px solid var(--line);border-left:4px solid var(--slate);padding:14px 16px;}
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;}
  .stat .val{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;margin-top:4px;}
  .stat.warn{border-left-color:var(--red);}

  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;}
  .col{flex:0 0 240px;background:rgba(0,0,0,0.03);border-radius:4px;padding:10px;min-height:120px;}
  .col-head{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 10px;border-bottom:2px solid var(--ink);margin-bottom:10px;}
  .col-head .name{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;}
  .col-head .count{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .col-total{font-size:11px;color:var(--ink-soft);margin:-6px 0 10px 4px;font-family:'JetBrains Mono',monospace;}

  .ticket{background:var(--ticket);border:1px solid var(--line);border-radius:3px;padding:12px 12px 10px;margin-bottom:10px;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.06);}
  .ticket:hover{border-color:var(--ink-soft);}
  .ticket::before{content:'';position:absolute;top:-5px;left:12px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1px solid var(--line);}
  .ticket-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange-dark);letter-spacing:0.5px;font-weight:500;}
  .ticket-client{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;margin:4px 0 2px;}
  .ticket-addr{font-size:11px;color:var(--ink-soft);margin-bottom:8px;line-height:1.4;}
  .ticket-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:0.3px;font-weight:600;}
  .badge-type{background:var(--slate-dark);color:#fff;}
  .val-money{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;}
  .paid-tag{font-size:10px;padding:2px 6px;border-radius:2px;font-weight:600;text-transform:uppercase;}
  .paid-unpaid{background:var(--red-bg);color:var(--red);}
  .paid-partial{background:var(--amber-bg);color:var(--amber);}
  .paid-paid{background:var(--green-bg);color:var(--green);}
  .empty-col{font-size:11px;color:var(--ink-soft);text-align:center;padding:20px 4px;font-style:italic;}

  .overlay{position:fixed;inset:0;background:rgba(20,18,14,0.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);border:2px solid var(--ink);max-width:480px;width:100%;padding:24px;position:relative;}
  .modal h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:20px;margin:0 0 16px;border-bottom:2px solid var(--ink);padding-bottom:10px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--ticket);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);border-radius:2px;}
  .field textarea{resize:vertical;min-height:50px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  .btn{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;padding:10px 18px;border:none;cursor:pointer;border-radius:2px;}
  .btn-primary{background:var(--orange);color:#fff;flex:1;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--ink-soft);color:var(--ink);}
  .btn-ghost:hover{background:rgba(0,0,0,0.05);}
  .btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn-danger:hover{background:var(--red-bg);}
  .close-x{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;}
  .config-warning{background:var(--red-bg);border:1px solid var(--red);color:var(--red);padding:16px;margin-bottom:20px;font-size:13px;line-height:1.5;}
  .config-warning code{background:rgba(0,0,0,0.06);padding:1px 5px;border-radius:2px;}

  .photo-drop{border:1.5px dashed var(--line);border-radius:3px;padding:14px;text-align:center;cursor:pointer;background:var(--ticket);}
  .photo-drop:hover{border-color:var(--ink-soft);}
  .photo-drop input{display:none;}
  .photo-drop .hint{font-size:11px;color:var(--ink-soft);}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px;}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;border:1px solid var(--line);background:#00000010;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(20,18,14,0.7);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:1;cursor:pointer;}
  .photo-thumb .uploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,18,14,0.4);color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;}
  .ticket-photocount{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-soft);}
  .card-thumbstrip{display:flex;gap:4px;margin-top:8px;}
  .card-thumbstrip img{width:32px;height:32px;object-fit:cover;border-radius:2px;border:1px solid var(--line);}

  .notes-log{max-height:160px;overflow-y:auto;border:1px solid var(--line);border-radius:2px;background:var(--ticket);}
  .notes-log:empty{display:none;}
  .note-entry{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.4;}
  .note-entry:last-child{border-bottom:none;}
  .note-ts{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);margin-bottom:2px;}
  .note-add-row{display:flex;gap:8px;margin-top:8px;}
  .note-add-row input{flex:1;}
  .note-add-row .btn{padding:8px 14px;}

  @media (max-width: 600px){
    .wrap{padding:16px 14px 40px;}
    .head{align-items:flex-start;}
    .head h1{font-size:26px;}
    .addbtn{width:100%;padding:14px 22px;font-size:16px;}
    .stats{grid-template-columns:1fr 1fr;}
    .col{flex:0 0 82vw;}
    .modal{padding:18px;max-height:92vh;overflow-y:auto;}
    .two-col{grid-template-columns:1fr;gap:0;}
    .field{margin-bottom:14px;}
    .field input,.field select,.field textarea{padding:12px 10px;font-size:16px;}
    .modal-actions{flex-direction:column-reverse;align-items:stretch;}
    .modal-actions > div{margin-left:0;flex-direction:column-reverse;}
    .btn{padding:14px 18px;font-size:14px;}
    .close-x{font-size:26px;top:14px;right:14px;padding:4px 8px;}
    .photo-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}
    .note-add-row{flex-direction:column;}
    .note-add-row .btn{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Spiritual Journey</h1>
      <div class="sub">Roofing &amp; construction — job tracker</div>
    </div>
    <button class="addbtn" id="newJobBtn">+ New job</button>
  </div>

  <div id="configWarning" class="config-warning" style="display:none;">
    Supabase isn't configured yet. Open <code>index.html</code> and set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script to your project's values (Supabase dashboard → Project Settings → API).
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="stats" id="stats"></div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="closeModal">&times;</button>
    <h2 id="modalTitle">New job</h2>
    <div class="field">
      <label>Client name</label>
      <input type="text" id="f_client" placeholder="Jordan Miller">
    </div>
    <div class="field">
      <label>Address</label>
      <input type="text" id="f_addr" placeholder="412 Maple St, Des Moines, IA">
    </div>
    <div class="two-col">
      <div class="field">
        <label>Job type</label>
        <select id="f_type">
          <option>Repair</option>
          <option>Replacement</option>
          <option>New install</option>
          <option>Inspection</option>
          <option>Snow Removal</option>
          <option>Remodel</option>
        </select>
      </div>
      <div class="field">
        <label>Stage</label>
        <select id="f_stage">
          <option value="lead">Lead</option>
          <option value="estimate">Estimate sent</option>
          <option value="scheduled">Scheduled</option>
          <option value="inprogress">In progress</option>
          <option value="invoiced">Invoiced</option>
          <option value="paid">Paid</option>
        </select>
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Estimate value ($)</label>
        <input type="number" id="f_value" placeholder="8500">
      </div>
      <div class="field">
        <label>Scheduled date</label>
        <input type="date" id="f_date">
      </div>
    </div>
    <div class="two-col" id="hourlyRow" style="display:none;">
      <div class="field">
        <label>Hourly rate ($)</label>
        <input type="number" id="f_hourly" placeholder="65">
      </div>
      <div class="field">
        <label>Estimated hours</label>
        <input type="number" id="f_hours" placeholder="4">
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Materials cost ($)</label>
        <input type="number" id="f_materials" placeholder="2200">
      </div>
      <div class="field">
        <label>Labor cost ($)</label>
        <input type="number" id="f_labor" placeholder="1800">
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Amount paid ($)</label>
        <input type="number" id="f_paid" placeholder="0">
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="text" id="f_phone" placeholder="(515) 555-0100">
      </div>
    </div>
    <div class="field">
      <label>Client email</label>
      <input type="email" id="f_email" placeholder="jordan@email.com">
    </div>
    <div class="field">
      <label>Notes</label>
      <div class="notes-log" id="notesLog"></div>
      <div class="note-add-row">
        <input type="text" id="f_note_new" placeholder="Add a note…">
        <button type="button" class="btn btn-ghost" id="addNoteBtn">Add</button>
      </div>
    </div>
    <div class="field">
      <label>Photos</label>
      <label class="photo-drop" id="photoDrop">
        <div>+ Add photos</div>
        <div class="hint">Roof damage, access shots, before/after</div>
        <input type="file" id="f_photos" accept="image/*" multiple capture="environment">
      </label>
      <div class="photo-grid" id="photoGrid"></div>
    </div>
    <div class="field" id="sendEstimateSection" style="display:none;">
      <label>Estimate delivery</label>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost" id="sendEstimateBtn">✉ Send estimate to client</button>
        <span id="estimateSentLabel" style="font-size:11px;color:var(--ink-soft);"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Delete job</button>
      <div style="display:flex;gap:10px;margin-left:auto;">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save job</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---- Supabase config ----
// Get these from your Supabase project: Project Settings > API
const SUPABASE_URL = 'https://bpxcbmlauxlekfxgnofp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_BS8o3WsBoRFHL0NolWNf2g_Lwh8NQ_C';

const configured = SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const STAGES = [
  {key:'lead', name:'Lead'},
  {key:'estimate', name:'Estimate sent'},
  {key:'scheduled', name:'Scheduled'},
  {key:'inprogress', name:'In progress'},
  {key:'invoiced', name:'Invoiced'},
  {key:'paid', name:'Paid'}
];

let jobs = [];
let editingId = null;
const PHOTO_BUCKET = 'job-photos';
let existingPhotos = [];   // URLs already saved to this job
let pendingFiles = [];     // File objects picked but not yet uploaded
let notesLog = [];         // {text, ts} entries, newest first

function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
}

function ticketNo(n){
  return 'SJ-' + String(n).padStart(4,'0');
}

function setStatus(msg, isError){
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.classList.toggle('error', !!isError);
}

// DB row <-> app job mapping (DB uses job_date, app uses date, to avoid SQL keyword friction)
function fromRow(row){
  return {
    id: row.id,
    num: row.num,
    client: row.client,
    addr: row.addr,
    type: row.type,
    stage: row.stage,
    value: row.value,
    date: row.job_date,
    materials: row.materials,
    labor: row.labor,
    paid: row.paid,
    phone: row.phone,
    notes: row.notes,
    photos: row.photos || [],
    hourly: row.hourly_rate,
    hours: row.hours_est,
    notes_log: row.notes_log || [],
    email: row.customer_email,
    estimateSentAt: row.estimate_sent_at
  };
}

function toRow(job){
  return {
    num: job.num,
    client: job.client,
    addr: job.addr,
    type: job.type,
    stage: job.stage,
    value: job.value === '' ? 0 : Number(job.value),
    job_date: job.date || null,
    materials: job.materials === '' ? 0 : Number(job.materials),
    labor: job.labor === '' ? 0 : Number(job.labor),
    paid: job.paid === '' ? 0 : Number(job.paid),
    phone: job.phone,
    notes: job.notes,
    photos: job.photos || [],
    hourly_rate: job.hourly === '' || job.hourly == null ? 0 : Number(job.hourly),
    hours_est: job.hours === '' || job.hours == null ? 0 : Number(job.hours),
    notes_log: job.notes_log || [],
    customer_email: job.email || null
  };
}

async function loadJobs(){
  if(!configured){
    document.getElementById('configWarning').style.display = 'block';
    document.getElementById('newJobBtn').disabled = true;
    render();
    return;
  }
  setStatus('Loading jobs…');
  const {data, error} = await sb.from('jobs').select('*').order('num', {ascending:true});
  if(error){
    setStatus('Could not load jobs: ' + error.message, true);
    jobs = [];
  } else {
    jobs = data.map(fromRow);
    setStatus('Synced with Supabase');
  }
  render();
}

function nextTicketNum(){
  if(!jobs.length) return 1;
  return Math.max(...jobs.map(j => j.num || 0)) + 1;
}

function paidStatus(job){
  const paid = Number(job.paid)||0;
  const val = Number(job.value)||0;
  if(job.stage !== 'invoiced' && job.stage !== 'paid') return null;
  if(paid <= 0) return {cls:'paid-unpaid', label:'Unpaid'};
  if(paid < val) return {cls:'paid-partial', label:'Partial'};
  return {cls:'paid-paid', label:'Paid'};
}

function render(){
  renderStats();
  renderBoard();
}

function renderStats(){
  const active = jobs.filter(j => j.stage !== 'paid').length;
  const pipelineValue = jobs.filter(j => j.stage !== 'paid').reduce((s,j)=>s+(Number(j.value)||0),0);
  const outstanding = jobs.filter(j => j.stage==='invoiced').reduce((s,j)=>s + Math.max((Number(j.value)||0)-(Number(j.paid)||0),0), 0);
  const thisWeek = (() => {
    const now = new Date();
    const in7 = new Date(now.getTime() + 7*24*60*60*1000);
    return jobs.filter(j => j.date && new Date(j.date) >= now && new Date(j.date) <= in7 && j.stage==='scheduled').length;
  })();

  const stats = [
    {label:'Active jobs', val: active},
    {label:'Pipeline value', val: fmtMoney(pipelineValue)},
    {label:'Scheduled this week', val: thisWeek},
    {label:'Outstanding balance', val: fmtMoney(outstanding), warn: outstanding > 0}
  ];

  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat${s.warn ? ' warn' : ''}">
      <div class="label">${s.label}</div>
      <div class="val">${s.val}</div>
    </div>
  `).join('');
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = STAGES.map(stage => {
    const colJobs = jobs.filter(j => j.stage === stage.key);
    const total = colJobs.reduce((s,j)=>s+(Number(j.value)||0),0);
    const cards = colJobs.length ? colJobs.map(j => cardHtml(j)).join('') : '<div class="empty-col">No jobs</div>';
    return `
      <div class="col">
        <div class="col-head">
          <span class="name">${stage.name}</span>
          <span class="count">${colJobs.length}</span>
        </div>
        <div class="col-total">${fmtMoney(total)}</div>
        ${cards}
      </div>
    `;
  }).join('');

  board.querySelectorAll('.ticket').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function cardHtml(job){
  const ps = paidStatus(job);
  const dateStr = job.date ? new Date(job.date + 'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  return `
    <div class="ticket" data-id="${job.id}">
      <div class="ticket-num">${ticketNo(job.num)}</div>
      <div class="ticket-client">${escapeHtml(job.client || 'Unnamed client')}</div>
      <div class="ticket-addr">${escapeHtml(job.addr || '')}</div>
      <div class="ticket-row">
        <span class="badge badge-type">${job.type}</span>
        <span class="val-money">${(job.type === 'Snow Removal' && job.hourly) ? fmtMoney(job.hourly) + '/hr' : fmtMoney(job.value)}</span>
      </div>
      <div class="ticket-row" style="margin-top:8px;">
        <span style="color:var(--ink-soft);">${dateStr}</span>
        ${ps ? `<span class="paid-tag ${ps.cls}">${ps.label}</span>` : ''}
      </div>
      ${(job.photos && job.photos.length) ? `
        <div class="card-thumbstrip">
          ${job.photos.slice(0,4).map(u => `<img src="${u}" loading="lazy">`).join('')}
          ${job.photos.length > 4 ? `<span class="ticket-photocount">+${job.photos.length-4}</span>` : ''}
        </div>` : ''}
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(id){
  editingId = id || null;
  const job = id ? jobs.find(j => j.id === id) : null;
  document.getElementById('modalTitle').textContent = job ? ticketNo(job.num) + ' — edit job' : 'New job';
  document.getElementById('f_client').value = job ? job.client || '' : '';
  document.getElementById('f_addr').value = job ? job.addr || '' : '';
  document.getElementById('f_type').value = job ? job.type : 'Repair';
  document.getElementById('f_stage').value = job ? job.stage : 'lead';
  document.getElementById('f_value').value = job ? job.value : '';
  document.getElementById('f_date').value = job ? job.date || '' : '';
  document.getElementById('f_materials').value = job ? job.materials : '';
  document.getElementById('f_labor').value = job ? job.labor : '';
  document.getElementById('f_paid').value = job ? job.paid : '';
  document.getElementById('f_phone').value = job ? job.phone || '' : '';
  document.getElementById('f_hourly').value = job ? (job.hourly || '') : '';
  document.getElementById('f_hours').value = job ? (job.hours || '') : '';
  document.getElementById('f_email').value = job ? job.email || '' : '';
  document.getElementById('deleteBtn').style.display = job ? 'inline-block' : 'none';
  document.getElementById('sendEstimateSection').style.display = job ? 'block' : 'none';
  document.getElementById('estimateSentLabel').textContent = (job && job.estimateSentAt)
    ? 'Last sent ' + new Date(job.estimateSentAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
    : '';
  existingPhotos = job ? (job.photos || []).slice() : [];
  pendingFiles = [];
  notesLog = job ? (job.notes_log || []).slice() : [];
  document.getElementById('f_note_new').value = '';
  document.getElementById('f_photos').value = '';
  renderPhotoGrid();
  renderNotesLog();
  updateHourlyVisibility();
  document.getElementById('overlay').classList.add('open');
}

function updateHourlyVisibility(){
  const show = document.getElementById('f_type').value === 'Snow Removal';
  document.getElementById('hourlyRow').style.display = show ? 'grid' : 'none';
}

function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function renderNotesLog(){
  const el = document.getElementById('notesLog');
  const sorted = notesLog.slice().sort((a,b) => new Date(b.ts) - new Date(a.ts));
  el.innerHTML = sorted.map(n => `
    <div class="note-entry">
      <div class="note-ts">${fmtTs(n.ts)}</div>
      <div>${escapeHtml(n.text)}</div>
    </div>
  `).join('');
}

function renderPhotoGrid(){
  const grid = document.getElementById('photoGrid');
  const existingHtml = existingPhotos.map((url, i) => `
    <div class="photo-thumb" data-kind="existing" data-idx="${i}">
      <img src="${url}">
      <button type="button" class="rm" data-kind="existing" data-idx="${i}">&times;</button>
    </div>
  `).join('');
  const pendingHtml = pendingFiles.map((file, i) => `
    <div class="photo-thumb" data-kind="pending" data-idx="${i}">
      <img src="${URL.createObjectURL(file)}">
      <button type="button" class="rm" data-kind="pending" data-idx="${i}">&times;</button>
    </div>
  `).join('');
  grid.innerHTML = existingHtml + pendingHtml;
  grid.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      if(btn.dataset.kind === 'existing') existingPhotos.splice(idx,1);
      else pendingFiles.splice(idx,1);
      renderPhotoGrid();
    });
  });
}

async function uploadPendingPhotos(jobNum){
  const urls = [];
  for(const file of pendingFiles){
    const path = `${jobNum}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const {error} = await sb.storage.from(PHOTO_BUCKET).upload(path, file, {upsert:false});
    if(error){ throw new Error('Photo upload failed: ' + error.message); }
    const {data} = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
    urls.push(data.publicUrl);
  }
  return urls;
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
  existingPhotos = [];
  pendingFiles = [];
  notesLog = [];
}

async function saveJob(){
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  setStatus('Saving…');

  const formJob = {
    client: document.getElementById('f_client').value.trim(),
    addr: document.getElementById('f_addr').value.trim(),
    type: document.getElementById('f_type').value,
    stage: document.getElementById('f_stage').value,
    value: document.getElementById('f_value').value,
    date: document.getElementById('f_date').value,
    materials: document.getElementById('f_materials').value,
    labor: document.getElementById('f_labor').value,
    paid: document.getElementById('f_paid').value,
    phone: document.getElementById('f_phone').value.trim(),
    hourly: document.getElementById('f_hourly').value,
    hours: document.getElementById('f_hours').value,
    notes_log: notesLog,
    email: document.getElementById('f_email').value.trim()
  };

  const jobNum = editingId ? (jobs.find(j => j.id === editingId) || {}).num : nextTicketNum();

  let newUrls = [];
  if(pendingFiles.length){
    setStatus('Uploading photos…');
    try{
      newUrls = await uploadPendingPhotos(jobNum);
    }catch(err){
      saveBtn.disabled = false;
      setStatus(err.message, true);
      return;
    }
  }
  formJob.photos = existingPhotos.concat(newUrls);

  setStatus('Saving…');
  let error;
  if(editingId){
    ({error} = await sb.from('jobs').update(toRow(formJob)).eq('id', editingId));
  } else {
    formJob.num = jobNum;
    ({error} = await sb.from('jobs').insert(toRow(formJob)));
  }

  saveBtn.disabled = false;
  if(error){
    setStatus('Save failed: ' + error.message, true);
    return;
  }
  closeModal();
  await loadJobs();
}

async function deleteJob(){
  if(!editingId) return;
  setStatus('Deleting…');
  const {error} = await sb.from('jobs').delete().eq('id', editingId);
  if(error){
    setStatus('Delete failed: ' + error.message, true);
    return;
  }
  closeModal();
  await loadJobs();
}

document.getElementById('newJobBtn').addEventListener('click', () => openModal(null));
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveJob);
document.getElementById('deleteBtn').addEventListener('click', deleteJob);
document.getElementById('sendEstimateBtn').addEventListener('click', async () => {
  const email = document.getElementById('f_email').value.trim();
  if(!email){ setStatus('Add a client email first', true); return; }
  if(!editingId){ setStatus('Save the job before sending an estimate', true); return; }

  const btn = document.getElementById('sendEstimateBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  setStatus('Sending estimate…');

  const job = jobs.find(j => j.id === editingId) || {};

  try{
    const res = await fetch('/api/send-estimate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        to: email,
        clientName: document.getElementById('f_client').value.trim(),
        ticketNo: ticketNo(job.num),
        jobType: document.getElementById('f_type').value,
        addr: document.getElementById('f_addr').value.trim(),
        value: document.getElementById('f_value').value,
        materials: document.getElementById('f_materials').value,
        labor: document.getElementById('f_labor').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Send failed');

    const sentAt = new Date().toISOString();
    await sb.from('jobs').update({estimate_sent_at: sentAt, customer_email: email}).eq('id', editingId);
    document.getElementById('estimateSentLabel').textContent = 'Last sent ' + new Date(sentAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    setStatus('Estimate sent to ' + email);
    await loadJobs();
  }catch(err){
    setStatus('Send failed: ' + err.message, true);
  }

  btn.disabled = false;
  btn.textContent = originalLabel;
});
document.getElementById('f_type').addEventListener('change', updateHourlyVisibility);
document.getElementById('addNoteBtn').addEventListener('click', () => {
  const input = document.getElementById('f_note_new');
  const text = input.value.trim();
  if(!text) return;
  notesLog.push({text, ts: new Date().toISOString()});
  input.value = '';
  renderNotesLog();
});
document.getElementById('f_note_new').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('addNoteBtn').click(); }
});
document.getElementById('f_photos').addEventListener('change', (e) => {
  pendingFiles = pendingFiles.concat(Array.from(e.target.files));
  e.target.value = '';
  renderPhotoGrid();
});
document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });

loadJobs();
</script>
</body>
</html>
